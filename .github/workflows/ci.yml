name: AI-Connex Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality-and-tests:
    name: Lint, Typecheck & Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Lockfile Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linter Check
        run: |
          ruff check contracts data-studio

      - name: Run Mypy Static Type Analysis
        run: |
          mypy contracts --ignore-missing-imports

      - name: Run Contract Unit Tests with Coverage
        run: |
          pytest tests/ --cov=contracts -v

  frontend-build:
    name: Frontend Shell Build & Verification
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --include=dev --legacy-peer-deps

      - name: Build React Production Shell
        run: |
          cd frontend
          npm run build

  container-build-scan:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Build Baseline Container Image (load into daemon)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: aiconnex-base:latest

      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aiconnex-base:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sandbox-image-pipeline:
    name: Level 4 Sandbox 5-Image Build, Scan, Syft & Cosign
    runs-on: ubuntu-latest
    needs: [container-build-scan]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx & BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Install Security Toolchain (Trivy, Syft, Cosign)
        run: |
          sudo bash sandbox/scripts/install-toolchain.sh

      - name: Build, Scan, SBOM & Sign 5 Parser Images
        run: |
          python sandbox/scripts/build_scan_sign.py

  publish-ghcr-images:
    name: Publish Container Images to GHCR
    runs-on: ubuntu-latest
    needs: [sandbox-image-pipeline]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Path for Docker Tag
        run: |
          echo "REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Base Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_PATH }}/aiconnex-base:latest
            ghcr.io/${{ env.REPO_PATH }}/aiconnex-base:${{ github.sha }}

  deploy-development:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: [publish-ghcr-images]
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploying to Dev Cluster
        run: echo "Successfully deployed ${{ github.sha }} to Development environment"

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [publish-ghcr-images]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploying to Staging Cluster
        run: echo "Successfully deployed ${{ github.sha }} to Staging environment"

  deploy-production:
    name: Deploy to Production Environment (Approval Gate)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploying to Production Cluster
        run: echo "Successfully deployed ${{ github.sha }} to Production environment"
