name: Security & Supply-Chain Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Automated Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast-bandit:
    name: Bandit Python Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST Scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Audit
        run: |
          bandit -r contracts/ data-studio/ aiconnex_agent/ -ll -ii --skip B101,B110,B311
