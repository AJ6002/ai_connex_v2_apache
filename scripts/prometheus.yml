global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aiconnex-fastapi"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["intake-api:8000"]

  - job_name: "aiconnex-sandbox"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sandbox-job-manager:8001"]
